      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: c23
            language-cpp: c++23
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            arm-thumb-mode: thumb
            callgraph-info: true
            not-use-syscalls: true
            output-debug-info: enable
            stack-usage: true
            use-newlib-nano: true
          linker:
            $toolName: auto
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
            use-float-printf: true
        scatterFilePath: boards/3833024/STM32F407XX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
      LLVM_ARM:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 1
          afterBuildTasks: []
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            C_FLAGS: --sysroot=/usr/arm-none-eabi --gcc-toolchain=/usr -fshort-enums
            language-c: c23
            language-cpp: c++23
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            output-debug-info: enable
          linker:
            $toolName: clang
            LD_FLAGS: --sysroot=/usr/arm-none-eabi --gcc-toolchain=/usr -fshort-enums -Wl,--specs=nano.specs -Wl,--specs=nosys.specs
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: Compiler/STM32F407XX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      Custom:
        bin: ""
        commandLine: openocd -f ./Compiler/stm32f407zg.cfg -c "init; halt; program ./build/3833024/${workspaceFolderBasename}.hex verify reset exit"
